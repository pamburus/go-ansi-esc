version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nlreturn
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 150
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 32
    lll:
      line-length: 140
    nolintlint:
      require-explanation: true
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: (.+)_test.go
        text: '^dot-imports: '
      - linters:
          - gosec
        text: '^G115: '
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pamburus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
